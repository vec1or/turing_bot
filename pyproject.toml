[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turing-arena-local"
version = "3.0.0"
description = "Локальный собеседник: собственный двойной энкодер и поиск по живым репликам"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
turing-arena = "turing_bot.cli:main"

[tool.setuptools]
packages = ["turing_bot"]

[tool.setuptools.package-data]
turing_bot = ["assets/*.npz", "assets/*.json", "assets/*.gz", "assets/*.db", "assets/retrieval/*"]
